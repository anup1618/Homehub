<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_14 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_14" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_14');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Create an abstract "futuristic home" wireframe representation
const group = new THREE.Group();
scene.add(group);

const material = new THREE.MeshPhongMaterial({
    color: 0x19ffdf, // Electric Teal
    wireframe: true,
    transparent: true,
    opacity: 0.3
});

// Central core
const coreGeom = new THREE.IcosahedronGeometry(1.5, 2);
const core = new THREE.Mesh(coreGeom, material);
group.add(core);

// Floating structure rings
for (let i = 0; i < 3; i++) {
    const ringGeom = new THREE.TorusGeometry(2.5 + i * 0.8, 0.02, 16, 100);
    const ring = new THREE.Mesh(ringGeom, material);
    ring.rotation.x = Math.random() * Math.PI;
    ring.rotation.y = Math.random() * Math.PI;
    group.add(ring);
}

const light = new THREE.PointLight(0x19ffdf, 1, 100);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

camera.position.z = 8;

const animate = () => {
    requestAnimationFrame(animate);
    group.rotation.y += 0.005;
    group.rotation.x += 0.002;
    
    // Mouse interaction
    const mouseX = (window.innerWidth / 2 - (window.u_mouse_x || 0)) * 0.0001;
    const mouseY = (window.innerHeight / 2 - (window.u_mouse_y || 0)) * 0.0001;
    group.rotation.y += mouseX;
    group.rotation.x += mouseY;

    renderer.render(scene, camera);
};

window.addEventListener('mousemove', (e) => {
    window.u_mouse_x = e.clientX;
    window.u_mouse_y = e.clientY;
});

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_14 -->


</body></html>
